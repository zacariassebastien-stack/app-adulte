name: Foundations
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: dart test test/domain test/catalog test/storage
      - run: flutter test
      - run: flutter build apk --debug
  catalog-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      # Strict acceptance and reproducibility of the committed audit.
      - run: dart test test/catalog/real_catalog_test.dart
      - run: dart run tool/audit_catalog.dart assets/catalog/source docs/catalog_audit.json
      - run: git diff --exit-code -- docs/catalog_audit.json
