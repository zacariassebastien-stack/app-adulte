name: couple_cards
description: Fondations du domaine, du catalogue et du stockage local.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  drift: ^2.28.1
  sqlite3: ^2.9.3
  sqlite3_flutter_libs: ^0.5.40
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
dev_dependencies:
  build_runner: ^2.7.0
  drift_dev: ^2.28.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.29.0
flutter:
  uses-material-design: true
  assets:
    - assets/catalog/source/cards.v2.fr.json
    - assets/catalog/source/profile_elements.v1.fr.json
    - assets/catalog/source/tags.v1.json
    - assets/catalog/source/catalog_v3_taxonomy.json
