name: couple_cards
description: Fondations du domaine, du catalogue et du stockage local.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  drift: ^2.28.1
  sqlite3: ^2.9.3
  sqlite3_flutter_libs: ^0.5.40
dev_dependencies:
  build_runner: ^2.7.0
  drift_dev: ^2.28.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.29.0
flutter:
  uses-material-design: true
  assets:
    - assets/catalog/source/cards.v2.fr.json
    - assets/catalog/source/profile_elements.v1.fr.json
    - assets/catalog/source/tags.v1.json
